<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finvanta Deployment Check</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ccc;
        }
        .test.pass { border-left-color: #10b981; }
        .test.fail { border-left-color: #ef4444; }
        .test.loading { border-left-color: #f59e0b; }
        h1 { color: #1f2937; }
        .status { font-weight: 600; margin-right: 10px; }
        .pass .status { color: #10b981; }
        .fail .status { color: #ef4444; }
        .detail { font-size: 14px; color: #6b7280; margin-top: 5px; }
        pre { background: #f9fafb; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Finvanta Deployment Diagnostics</h1>
    <p>Testing data loading paths and accessibility...</p>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        const tests = [];
        
        function addTest(name, status, detail) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <span class="status">${status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⏳'}</span>
                <strong>${name}</strong>
                ${detail ? `<div class="detail">${detail}</div>` : ''}
            `;
            results.appendChild(div);
        }
        
        async function runTests() {
            // Test 1: BASE_URL detection
            const baseUrl = document.location.origin + '/finvanta-diagnostic/';
            addTest('Base URL Detection', 'pass', `Detected: ${baseUrl}`);
            
            // Test 2-4: Analytics files
            const scenarios = ['low', 'moderate', 'high'];
            for (const scenario of scenarios) {
                try {
                    const path = `${baseUrl}outputs/phase3_analytics/${scenario}_bottleneck_mix_analytics.json`;
                    const response = await fetch(path);
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.analytics && data.analytics.facilityParticipationCascade) {
                            addTest(`${scenario.charAt(0).toUpperCase() + scenario.slice(1)} Scenario Data`, 'pass', 
                                `Loaded successfully from: ${path}`);
                        } else {
                            addTest(`${scenario.charAt(0).toUpperCase() + scenario.slice(1)} Scenario Data`, 'fail',
                                `Invalid structure in: ${path}`);
                        }
                    } else {
                        addTest(`${scenario.charAt(0).toUpperCase() + scenario.slice(1)} Scenario Data`, 'fail',
                            `HTTP ${response.status} from: ${path}`);
                    }
                } catch (err) {
                    addTest(`${scenario.charAt(0).toUpperCase() + scenario.slice(1)} Scenario Data`, 'fail',
                        `Error: ${err.message}`);
                }
            }
            
            // Test 5: Config file
            try {
                const configPath = `${baseUrl}config/recommendationRules.json`;
                const response = await fetch(configPath);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.rules && Array.isArray(data.rules)) {
                        addTest('Recommendation Rules', 'pass',
                            `${data.rules.length} rules loaded from: ${configPath}`);
                    } else {
                        addTest('Recommendation Rules', 'fail',
                            `Invalid structure in: ${configPath}`);
                    }
                } else {
                    addTest('Recommendation Rules', 'fail',
                        `HTTP ${response.status} from: ${configPath}`);
                }
            } catch (err) {
                addTest('Recommendation Rules', 'fail',
                    `Error: ${err.message}`);
            }
            
            // Test 6: Browser info
            addTest('Browser Info', 'pass', 
                `${navigator.userAgent}<br>Location: ${document.location.href}`);
                
            // Test 7: CORS check
            addTest('CORS Status', 'pass', 
                'All fetch requests completed (no CORS errors)');
        }
        
        runTests();
    </script>
</body>
</html>
