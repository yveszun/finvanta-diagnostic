name: Deploy to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run test suite
        run: npm test -- --run
        env:
          CI: true
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      
      - name: Verify build output
        run: |
          echo "Build directory contents:"
          ls -la dist/
          echo ""
          echo "Checking for critical assets:"
          test -f dist/index.html && echo "✅ index.html exists" || echo "❌ index.html missing"
          test -d dist/assets && echo "✅ assets/ directory exists" || echo "❌ assets/ missing"
          test -d dist/outputs && echo "✅ outputs/ directory exists" || echo "❌ outputs/ missing"
          echo ""
          echo "Scenario data files:"
          ls -la dist/outputs/phase3_analytics/ || echo "❌ Analytics directory missing"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
  
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
